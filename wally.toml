[package]
name = "nobodyyy-dev/roblox"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
private = true

[dependencies]
Trove = "sleitnick/trove@1.8.0"
Signal = "sleitnick/signal@2.0.3"
t = "osyrisrblx/t@3.1.1"
React = "roblox/react@17.3.13"
ReactRoblox = "roblox/react-roblox@17.3.13"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"

[dev-dependencies]
Jest = "roblox/jest@3.20.1"
JestGlobals = "roblox/jest-globals@3.20.1"

[place]
shared-packages = "game.ReplicatedStorage.Packages"
server-packages = "game.ServerStorage.ServerPackages"
